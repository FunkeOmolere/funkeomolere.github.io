<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Funke Omolere</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    display:flex; align-items:center; justify-content:center;
    font-family: 'Segoe UI', sans-serif;
    padding: 24px;
  }
  .card {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 28px;
    padding: 40px 32px;
    max-width: 360px;
    width: 100%;
    text-align: center;
  }
  .name { font-size: 24px; font-weight: 800; color: #fff; margin-bottom: 4px; }
  .role { font-size: 13px; color: #a78bfa; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 32px; }
  a.link {
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:14px; margin-bottom:12px; border-radius:12px;
    border:1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.08);
    color:#fff; text-decoration:none; font-size:15px; font-weight:600;
  }
</style>
</head>
<body>
<div class="card">
  <div class="name">Funke Omolere</div>
  <div class="role">GRC Lead · Speaker · Founder, Shift &amp; Connect</div>
  <a class="link" href="https://funkeomolere.github.io" target="_blank">Portfolio</a>
  <a class="link" href="https://www.linkedin.com/in/funkeomolere" target="_blank">LinkedIn</a>
  <a class="link" href="https://www.instagram.com/cybershiftwithfunke" target="_blank">Instagram</a>
</div>
</body>
</html>
